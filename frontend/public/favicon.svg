<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="AniTracker" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>AniTracker</title>

  <!-- Black flag background -->
  <rect width="64" height="64" rx="14" fill="#101014"/>

  <!-- Crossed bones -->
  <g stroke="#F5EFE0" stroke-width="5.5" stroke-linecap="round">
    <line x1="12" y1="12" x2="52" y2="52"/>
    <line x1="52" y1="12" x2="12" y2="52"/>
  </g>
  <g fill="#F5EFE0">
    <circle cx="14.5" cy="9.5" r="3.6"/><circle cx="9.5" cy="14.5" r="3.6"/>
    <circle cx="54.5" cy="49.5" r="3.6"/><circle cx="49.5" cy="54.5" r="3.6"/>
    <circle cx="54.5" cy="14.5" r="3.6"/><circle cx="49.5" cy="9.5" r="3.6"/>
    <circle cx="14.5" cy="54.5" r="3.6"/><circle cx="9.5" cy="49.5" r="3.6"/>
  </g>

  <!-- Gold medallion with progress ring -->
  <circle cx="32" cy="32" r="18" fill="#101014"/>
  <circle cx="32" cy="32" r="16" fill="none" stroke="#FBBF24" stroke-opacity="0.3" stroke-width="3.5"/>
  <circle cx="32" cy="32" r="16" fill="none" stroke="#FBBF24" stroke-width="3.5"
          stroke-linecap="round" pathLength="100" stroke-dasharray="72 28"
          transform="rotate(-90 32 32)"/>

  <!-- Red play button -->
  <polygon points="28,24 28,40 41,32" fill="#EF4444" stroke="#EF4444"
           stroke-width="2.5" stroke-linejoin="round"/>
</svg>
